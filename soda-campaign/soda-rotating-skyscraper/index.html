<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=160, initial-scale=1.0">
    <meta name="ad.size" content="width=160,height=600">
    <title>Soda Cola - Skyscraper 160x600</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="creative" href="https://exemplo.com/soda-cola" target="_blank" rel="noopener" aria-label="Conheça a Soda Cola">
        <div class="burst burst-top" aria-hidden="true"></div>
        <div class="burst burst-bottom" aria-hidden="true"></div>

        <header class="intro">
            <p class="eyebrow">Refresque o momento</p>
            <h1>SODA</h1>
        </header>

        <div class="can-stage" aria-hidden="true">
            <div class="can-shadow"></div>
            <div class="can-layers">
                <img class="can-layer can-base" src="assets/corpodalata.svg" alt="" width="80" height="140">
                <img class="can-layer can-label" src="assets/rotulo.svg" alt="" width="80" height="140">
                <img class="can-layer can-lid" src="assets/lacre.svg" alt="" width="80" height="30">
                <img class="can-layer can-shine" src="assets/overlaydereflexo.svg" alt="" width="80" height="140">
            </div>
        </div>

        <div class="message">
            <p class="tagline">Sabor que faz fizz.</p>
            <span class="cta">Experimente já <span aria-hidden="true">&#8594;</span></span>
        </div>

        <span class="legal">SODA COLA</span>
    </a>
    <script src="script.js"></script>
</body>
</html>
